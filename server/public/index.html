<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="网易云遥控">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>网易云遥控</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <div class="ambient" id="ambient"></div>

  <header class="top">
    <div class="brand">
      <span class="dot" id="dot"></span>
      <h1 id="title">网易云遥控</h1>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnSearch" aria-label="搜索"></button>
      <button class="icon-btn" id="btnPair" aria-label="连接信息"></button>
    </div>
  </header>

  <main id="main" class="main"></main>

  <div class="mini" id="mini" hidden>
    <div class="mini-art"><img id="miniCover" alt=""></div>
    <div class="mini-meta">
      <div class="mini-name" id="miniName">未在播放</div>
      <div class="mini-ar" id="miniAr"></div>
    </div>
    <button class="round" id="miniPlay" aria-label="播放/暂停"></button>
    <button class="ghost" id="miniNext" aria-label="下一首"></button>
  </div>

  <section class="player" id="player" hidden>
    <div class="player-art-bg" id="playerBg"></div>
    <div class="player-head">
      <button class="icon-btn" id="playerClose" aria-label="收起"></button>
      <div class="player-src" id="playerSrc">正在播放</div>
      <div class="head-right">
        <button class="icon-btn" id="playerLyric" aria-label="歌词"></button>
        <button class="icon-btn" id="playerQueue" aria-label="队列"></button>
      </div>
    </div>
    <div class="player-art" id="playerArt"><img id="bigCover" alt=""></div>
    <div class="lyrics" id="lyrics" hidden></div>
    <div class="ly-offset" id="lyOffset" hidden>
      <button class="ly-off-btn" id="lyMinus" aria-label="歌词提前">−0.1s</button>
      <button class="ly-off-val" id="lyVal">0.0s</button>
      <button class="ly-off-btn" id="lyPlus" aria-label="歌词延后">+0.1s</button>
      <button class="ly-off-reset" id="lyReset">重置</button>
    </div>
    <div class="player-info">
      <div class="p-name" id="pName">—</div>
      <div class="p-ar" id="pAr"></div>
    </div>
    <div class="seek">
      <span class="t" id="tCur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1">
      <span class="t" id="tDur">0:00</span>
    </div>
    <div class="controls">
      <button class="mode-btn" id="modeBtn"></button>
      <button class="ctrl" id="btnPrev"></button>
      <button class="ctrl main-ctrl" id="btnPlay"></button>
      <button class="ctrl" id="btnNext"></button>
      <button class="ctrl small" id="btnQueue2"></button>
    </div>
    <div class="vol">
      <span id="volIcon"></span>
      <input type="range" id="vol" min="0" max="100" value="60">
      <span class="vol-num" id="volNum">60%</span>
    </div>
  </section>

  <section class="queue-panel" id="queuePanel" hidden>
    <div class="queue-head">
      <span>播放队列 <em id="qCount"></em></span>
      <button class="icon-btn" id="queueClose"></button>
    </div>
    <div class="queue-list" id="queueList"></div>
  </section>

  <div class="busy" id="busy" hidden><div class="spinner"></div><span id="busyText">正在处理…</span></div>
  <div class="toast" id="toast"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
